# ===========================================================
#  台股當沖候選設定檔。「#」後面是註解，不影響設定。
# ===========================================================

[filter]
# 不符合以下條件的個股不會列入候選
min_price    = 10      # 最低股價（元）
max_price    = 1000    # 最高股價（元），避免一張金額過大
min_dt_buy   = 5       # 當日當沖買進金額下限（億元），確保流動性
min_range5   = 3.0     # 5 日平均振幅下限（%）
max_tick_pct = 0.35    # 每跳一檔占股價比例上限（%），太高代表成本吃掉空間
max_dt_ratio = 80      # 當沖量占總成交量上限（%），太高代表過熱

[weights]
# 評分權重，換算成 0～100 分；填 0 代表不採用
volatility = 3   # 5 日平均振幅，越大越高分
liquidity  = 3   # 當沖買進金額，越大越高分
tick       = 2   # 每檔跳動占比，越小越高分
heat       = 1   # 當沖占比，越低越高分
chips      = 1   # 三大法人買賣超占成交量比例，絕對值越大越高分

[plan]
# 進出場計畫，以「5 日平均振幅換算的元數」為單位（R）
entry_r  = 0.5     # 進場：今日高點或低點，但最遠只到收盤價上下 0.5 R
stop_r   = 0.35    # 停損距離
target_r = 0.7     # 目標距離
cost_pct = 0.435   # 一趟成本（%）：手續費 0.1425% × 2 + 當沖證交稅 0.15%，手續費有折扣可自行下修

[paper]
# 紙上追蹤：不實際下單，只記錄計畫和隔日結果。修改只影響之後的新計畫，舊紀錄不會變。
start          = "2026-11-02"   # 從這天的計畫開始算，不含回測資料（要加引號）
target_r       = 0.15           # 目標距離（R）
max_loss_pct   = 3.0            # 硬停損：單筆最多虧損幾 %（跳空可能超過）
slippage_ticks = 1              # 進出各假設滑價幾檔
# 達標條件（以保守算法為準）
min_trades     = 100            # 至少幾筆實際觸發
worst_loss_pct = 5.0            # 最差一筆不超過幾 %

[report]
top_n       = 5    # 報告列出幾檔
retain_days = 10   # 行情歷史保留幾個交易日（每天都會 commit，不要設太大）
